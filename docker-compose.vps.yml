# VPS / production overlay.
#
# Database: a STANDALONE dockerized PostgreSQL container (api/scripts/docker-compose.yml)
# running on the VPS host. The api reaches it via host.docker.internal:5432 (its published
# port), exactly like local — so SQLALCHEMY_DATABASE_URL in .env stays host.docker.internal.
# Bring the DB up first, once per host:
#   docker compose -f api/scripts/docker-compose.yml up -d
#
# This overlay attaches the public-facing services to the shared external reverse-proxy
# network and bakes the production API URL into the frontend images at build time.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
services:
  api:
    environment:
      APP_ENV: production
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/firebase-adminsdk.json
    networks:
      - default
      - global-proxy-network
    volumes:
      - ./api/secrets/aadikarta-vedic-astrology-firebase-adminsdk-fbsvc-0f4829e306.json:/app/secrets/firebase-adminsdk.json:ro
  web:
    build:
      args:
        VITE_API_URL: "https://api.aadikarta.org"
    networks:
      - default
      - global-proxy-network

  admin:
    build:
      args:
        VITE_API_URL: "https://api.aadikarta.org"
    networks:
      - default
      - global-proxy-network

  umami:
    networks:
      - default
      - global-proxy-network

  mirotalk:
    networks:
      - default
      - global-proxy-network

  # Receives the CI-triggered deploy webhook (see deploy/hooks.json,
  # deploy/deploy.sh). Only global-proxy needs to reach it, so it's not on
  # the default network. It mounts the docker socket so deploy.sh can run
  # `docker compose build/up` against the host daemon — that's effectively
  # root-equivalent host access, but it's the same trust level a manual SSH
  # deploy already has.
  webhook:
    build: ./deploy
    container_name: astro_webhook
    restart: unless-stopped
    environment:
      DEPLOY_WEBHOOK_SECRET: "${DEPLOY_WEBHOOK_SECRET}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/aadikarta-app/production:/root/aadikarta-app/production
      - ./deploy/hooks.json:/etc/webhook/hooks.json:ro
    networks:
      - global-proxy-network

networks:
  global-proxy-network:
    external: true
