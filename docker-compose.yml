# Base stack — services shared by every environment.
#
# Do NOT run this file on its own. Always combine it with one environment overlay,
# which decides where the database lives and what API URL the frontends are built with:
#
#   Local (macOS, native Postgres on the host):
#     docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
#   VPS (standalone dockerized Postgres — see api/scripts/docker-compose.yml):
#     docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
#
# The DB connection (SQLALCHEMY_DATABASE_URL) and other secrets come from .env.
services:
  api:
    build: ./api
    container_name: astro_api
    env_file:
      - .env
    environment:
      SQLALCHEMY_DATABASE_URL: "${SQLALCHEMY_DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      RAZORPAY_KEY_TEST_ID: "${RAZORPAY_KEY_TEST_ID}"
      RAZORPAY_KEY_TEST_SECRET: "${RAZORPAY_KEY_TEST_SECRET}"
      RAZORPAY_KEY_LIVE_ID: "${RAZORPAY_KEY_LIVE_ID}"
      RAZORPAY_KEY_LIVE_SECRET: "${RAZORPAY_KEY_LIVE_SECRET}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET}"
      RAZORPAY_WEBHOOK_SECRET_TEST: "${RAZORPAY_WEBHOOK_SECRET_TEST}"
    ports:
      - "9000:8000"
    volumes:
      - ./api/uploads:/app/uploads
    depends_on:
      - redis
    # Lets the api container reach Postgres running on the Docker host
    # (native Postgres locally, the standalone Postgres container on the VPS).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    deploy:
      resources:
        limits:
          # 512M was too tight for ffmpeg's Ken Burns zoompan filter (upscales
          # source images ~5-6x before panning), which OOM-killed real Content
          # Studio renders. Bumped to give headroom for that step.
          cpus: '1.00'
          memory: 1.5G

  web:
    build:
      context: ./web
    container_name: astro_web
    ports:
      - "4002:80"
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  admin:
    build:
      context: ./admin
    container_name: astro_admin
    ports:
      - "4001:80"
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  redis:
    image: "redis:alpine"
    container_name: astro_redis
    ports:
      - "6389:6379"
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  mirotalk:
    # Pinned (v2.3.00): the API's token format, the user-auth behaviour and the
    # webhook payload shapes it relies on were verified against this build.
    # Re-verify the classroom join + attendance flow before changing it.
    image: mirotalk/sfu@sha256:87ae7265c44804a33cee76503b11139f527024b645e4ac079d64125bf9e700bf
    container_name: astro_mirotalk
    ports:
      - "4020:3010"
    environment:
      - PORT=3010
      - TRUST_PROXY=true
      - API_KEY_SECRET=${MIROTALK_API_KEY_SECRET}
      - JWT_SECRET=${MIROTALK_JWT_SECRET}
      # Only peers holding a token signed by the API (carrying this service
      # account) may join; token-less joins are rejected.
      - HOST_USER_AUTH=true
      - HOST_USERS=${MIROTALK_PEER_USERNAME}:${MIROTALK_PEER_PASSWORD}:Aadikarta:*
      # Presenter rights come only from the token (tutor/admin), never from joining first.
      - PRESENTER_JOIN_FIRST=false
      # Attendance: join/exit/disconnect events go to the API over the Docker network.
      - WEBHOOK_ENABLED=true
      - WEBHOOK_URL=http://api:8000/edu/webhooks/mirotalk
      # --- Classroom branding & UI (settings verified against the pinned v2.3.00) ---
      - "APP_NAME=Aadikarta: Memory Class"
      - "SITE_TITLE=Aadikarta: Memory Class"
      - "APP_TITLE=<h1>Aadikarta: Memory Class</h1>"
      - "APP_DESCRIPTION=Live classes for enrolled Aadikarta students. Join your class from your Aadikarta dashboard."
      - "META_DESCRIPTION=Aadikarta: Memory Class — live online classes."
      - "META_KEYWORDS=aadikarta, memory class, live class"
      - "OG_SITE_NAME=Aadikarta: Memory Class"
      - "OG_TITLE=Aadikarta: Memory Class"
      - "OG_DESCRIPTION=Live online classes for enrolled Aadikarta students."
      # Same icons as the main website (mounted below)
      - SITE_ICON_PATH=../images/aadikarta/favicon.ico
      - APPLE_TOUCH_ICON_PATH=../images/aadikarta/apple-touch-icon.png
      - "WHO_ARE_YOU_TITLE=Aadikarta: Memory Class - Waiting for your tutor"
      - "WHO_ARE_YOU_WAITING_ROOM_HEADING=Waiting for your tutor..."
      - "WHO_ARE_YOU_WAITING_ROOM_DESCRIPTION=The class hasn't started yet.<br />You'll join automatically when your tutor opens the room."
      - "WHO_ARE_YOU_WAITING_ROOM_WAITING=Waiting for your tutor to start the class..."
      # Remove MiroTalk's own promotion
      - SHOW_TOP_SPONSORS=false
      - SHOW_FEATURES=false
      - SHOW_TEAMS=false
      - SHOW_TRY_EASIER=false
      - SHOW_POWERED_BY=false
      - SHOW_SPONSORS=false
      - SHOW_PAST_SPONSORS=false
      - SHOW_ADVERTISERS=false
      - SHOW_SUPPORT_US=false
      - SHOW_FOOTER=false
      - SHOW_ABOUT=false
      # Hidden tools: room sharing/invites (access comes only via the app),
      # live-streaming, participant location, polls, breakout rooms.
      # Kept at defaults: whiteboard, recording (host only), file sharing, screen sharing.
      - SHOW_SHARE_BUTTON=false
      - SHOW_SHARE_ROOM_POPUP=false
      - SHOW_SHARE_ROOM_QR_ON_HOVER=false
      - SHOW_EMAIL_INVITE=false
      - SHOW_RTMP_TAB=false
      - SHOW_BROADCASTING=false
      - SHOW_GEO_LOCATION=false
      - SHOW_POLL_BUTTON=false
      - SHOW_BREAKOUT_ROOM_BUTTON=false
    volumes:
      # Main website icons, served by MiroTalk at /images/aadikarta/...
      - ./web/public/favicon.ico:/src/public/images/aadikarta/favicon.ico:ro
      - ./web/public/apple-touch-icon.png:/src/public/images/aadikarta/apple-touch-icon.png:ro
      # Site logo in place of MiroTalk's (loading, login and waiting screens).
      # Generated by mirotalk/branding/make_logo_svg.py from web/public/assets/logo.webp.
      - ./mirotalk/branding/logo.svg:/src/public/images/logo.svg:ro
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G

networks:
  default:
    name: astro-app-network
